# Enable gzip compression
gzip on;
gzip_types text/plain text/css application/javascript application/json text/xml application/xml text/html;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;

# Enable Brotli compression
brotli on;
brotli_types text/plain text/css application/javascript application/json text/xml application/xml text/html;
brotli_comp_level 5;
brotli_static on;
