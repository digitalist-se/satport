# TEMPORARY MAINTENANCE CONFIGURATION
#
# Two critical, unauthenticated remote code execution vulnerabilities were found
# in PHP (CVE-2026-109618, CVE-2026-109619). They are fixed in PHP 8.3.36
# (https://www.php.net/), but the Upsun php:8.3 runtime does not ship that
# version yet. Until it does, the PHP container is taken down and the app runs
# as a minimal non-PHP container that serves a static maintenance page for
# every request.
#
# The name, relationships, disk and mounts are kept unchanged so the database,
# Redis and the uploaded files survive untouched. To bring the site back,
# revert this change once Upsun's php:8.3 runtime is at 8.3.36 or newer.
#
# Complete list of all available properties: https://docs.platform.sh/create-apps/app-reference.html

# A unique name for the app. Must be lowercase alphanumeric characters. Changing the name destroys data associated
# with the app.
name: 'drupal'

# The runtime the application uses.
# Deliberately not PHP, see the note at the top of this file.
type: 'python:3.11'

# The relationships of the application with services or other applications.
# Kept so the services and their data stay in place.
relationships:
    database: 'db:mysql'
    redis: 'cache:redis'

# The size of the persistent disk of the application (in MB). Minimum value is 128.
disk: 2048

# The 'mounts' describe writable, persistent filesystem mounts in the application.
# Kept so the uploaded files, private files and tmp data are preserved.
mounts:
    # The default Drupal files directory.
    '/web/sites/default/files':
        source: local
        source_path: 'files'
    # Drupal gets its own dedicated tmp directory. The settings.platformsh.php
    # file will automatically configure Drupal to use this directory.
    '/tmp':
        source: local
        source_path: 'tmp'
    # Private file uploads are stored outside the web root. The settings.platformsh.php
    # file will automatically configure Drupal to use this directory.
    '/private':
        source: local
        source_path: 'private'
    # Drush needs a scratch space for its own caches.
    '/.drush':
        source: local
        source_path: 'drush'
    # Drush will try to save backups to this directory, so it must be
    # writeable even though you will almost never need to use it.
    '/drush-backups':
        source: local
        source_path: 'drush-backups'

# Configuration of the build of this application.
# No Composer or theme build, nothing runs in this container.
build:
    flavor: none

# The web key configures the web server running in front of your app.
# Every request is answered with the static maintenance page.
web:
    commands:
        start: sleep infinity
    locations:
        '/':
            root: 'static'
            expires: -1
            passthru: '/page-down.html'
            scripts: false
            allow: false
            rules:
                '^/page-down\.html$':
                    allow: true

# Variables to control the environment. More information: https://docs.platform.sh/create-apps/app-reference.html#variables
variables:
    env:
        N_PREFIX: /app/.global
        ENV: platformsh
        SATPORT_THEME_PATH: web/themes/custom/satport_theme
